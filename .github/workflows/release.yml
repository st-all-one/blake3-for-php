name: Release

on:
    push:
        tags:
            - "v*"

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        name: Official release
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout tagged commit
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Validate release tag
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail

                  TAG="${GITHUB_REF_NAME}"
                  VERSION="${TAG#v}"

                  if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Tag ${TAG} is not a valid SemVer release tag." >&2
                      exit 1
                  fi

                  if [ "$(git cat-file -t "${TAG}")" != "tag" ]; then
                      echo "Tag ${TAG} must be annotated (git tag -a ...)." >&2
                      exit 1
                  fi

                  TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
                  git fetch --no-tags origin "${DEFAULT_BRANCH}"
                  if ! git merge-base --is-ancestor "${TAG_COMMIT}" "origin/${DEFAULT_BRANCH}"; then
                      echo "Tag ${TAG} is not reachable from origin/${DEFAULT_BRANCH}." >&2
                      exit 1
                  fi

                  FIRST_VERSION=$(grep -m1 -oP '^## \[\K[^\]]+' CHANGELOG.md || true)
                  if [ "${FIRST_VERSION}" != "${VERSION}" ]; then
                      echo "CHANGELOG.md starts with [${FIRST_VERSION}], expected [${VERSION}]." >&2
                      exit 1
                  fi

                  echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
                  echo "TAG_COMMIT=${TAG_COMMIT}" >> "${GITHUB_ENV}"

            - name: Build and verify
              run: |
                  make check
                  make smoke
                  make audit

            - name: Build release artifacts
              run: |
                  set -euo pipefail

                  PREFIX="blake3-for-php-${VERSION}"
                  rm -rf dist
                  mkdir -p dist

                  git archive --format=tar.gz --prefix="${PREFIX}/" \
                      --output="dist/${PREFIX}.tar.gz" "${GITHUB_REF_NAME}"
                  git archive --format=zip --prefix="${PREFIX}/" \
                      --output="dist/${PREFIX}.zip" "${GITHUB_REF_NAME}"

                  tar -tzf "dist/${PREFIX}.tar.gz" >/dev/null
                  unzip -tq "dist/${PREFIX}.zip" >/dev/null

                  (
                      cd dist
                      sha256sum "${PREFIX}.tar.gz" "${PREFIX}.zip" > SHA256SUMS
                  )

                  awk -v prefix="## [${VERSION}]" '
                      index($0, prefix) == 1 { capture = 1 }
                      capture && /^## \[/ && index($0, prefix) != 1 { exit }
                      capture { print }
                  ' CHANGELOG.md > dist/changelog-section.md

                  {
                      echo "# BLAKE3 for PHP ${VERSION}"
                      echo
                      echo "Composer:"
                      echo
                      echo '```bash'
                      echo "composer require st-all-one/blake3:${VERSION}"
                      echo '```'
                      echo
                      cat dist/changelog-section.md
                      echo
                      echo "## Quality gate"
                      echo
                      echo "- Full \`make check\` on glibc (Debian 13) and musl (Alpine 3.24), PHP 8.4.27."
                      echo "- PHPStan max, Mago lint/format, PHPUnit, 100% statement coverage."
                      echo "- External consumer smoke test and Composer audit."
                      echo
                      echo "## Artifacts"
                      echo
                      echo "- \`${PREFIX}.tar.gz\`"
                      echo "- \`${PREFIX}.zip\`"
                      echo "- \`SHA256SUMS\`"
                      echo
                      echo "Verify the downloaded archives with \`sha256sum -c SHA256SUMS\`."
                      echo
                      echo "Commit: \`${TAG_COMMIT}\`"
                  } > dist/release-notes.md

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  PREFIX="blake3-for-php-${VERSION}"
                  TITLE="BLAKE3 for PHP ${VERSION}"

                  if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                      gh release upload "${GITHUB_REF_NAME}" \
                          "dist/${PREFIX}.tar.gz" \
                          "dist/${PREFIX}.zip" \
                          dist/SHA256SUMS \
                          --clobber
                      gh release edit "${GITHUB_REF_NAME}" \
                          --title "${TITLE}" \
                          --notes-file dist/release-notes.md
                  elif [[ "${VERSION}" == *-* ]]; then
                      gh release create "${GITHUB_REF_NAME}" \
                          "dist/${PREFIX}.tar.gz" \
                          "dist/${PREFIX}.zip" \
                          dist/SHA256SUMS \
                          --verify-tag \
                          --title "${TITLE}" \
                          --notes-file dist/release-notes.md \
                          --prerelease
                  else
                      gh release create "${GITHUB_REF_NAME}" \
                          "dist/${PREFIX}.tar.gz" \
                          "dist/${PREFIX}.zip" \
                          dist/SHA256SUMS \
                          --verify-tag \
                          --title "${TITLE}" \
                          --notes-file dist/release-notes.md
                  fi
