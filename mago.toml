# Mago 1.59 — parser, linter and formatter for PHP 8.4.
version = "1.59.0"
php-version = "8.4"

[source]
paths = ["src", "tests", "tools", "benchmarks"]
includes = []
excludes = ["build", "vendor", ".phpunit.cache"]

[formatter]
print-width = 120
end-of-line = "lf"
single-quote = true
trailing-comma = true
use-tabs = false

[linter]
# PHPUnit expectation/assertion rules are relevant for the test suite.
integrations = ["phpunit"]

[linter.rules.cyclomatic-complexity]
# Hasher is one cohesive algorithm. Splitting it would add abstractions and object
# allocation on the hot path without isolating a real defect. The class score is 17.
threshold = 20

[linter.rules.kan-defect]
# Same rationale: the cryptographic control flow is intentional. Score: 1.65.
threshold = 2.0

[linter.rules.too-many-methods]
# The class is a self-contained codec (compression, tree, streaming and validation).
# Splitting it into collaborators would obscure the algorithm and cost allocations.
threshold = 25

[linter.rules.no-boolean-flag-parameter]
# Deliberate API parity with PHP's hash()/hash_final() raw-output flag. The flag is
# documented and tested; splitting it would duplicate the public surface.
enabled = false
